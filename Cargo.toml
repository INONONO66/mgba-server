[package]
name = "mgba-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [
  "crates/auth",
  "crates/config",
  "crates/gateway",
  "crates/instances",
  "crates/mgba",
  "crates/libretro",
  "crates/ipc",
  "crates/streaming",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
bincode = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"

[dependencies]
grokemon-auth = { path = "crates/auth" }
grokemon-config = { path = "crates/config" }
grokemon-gateway = { path = "crates/gateway" }
grokemon-instances = { path = "crates/instances" }
grokemon-mgba = { path = "crates/mgba" }
grokemon-ipc = { path = "crates/ipc" }
grokemon-libretro = { path = "crates/libretro" }
grokemon-streaming = { path = "crates/streaming" }
async-trait = { workspace = true }
axum = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

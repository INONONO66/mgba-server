<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mGBA Multi-Instance Dashboard</title>
    <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --card-border: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #666;
      --accent: #00e676;
      --warn: #ff9800;
      --error: #f44336;
      --header-h: 52px;
      --radius: 6px;
      --font: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html,
    body {
      height: 100%;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Header ─────────────────────────────────────────── */
    #header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 100;
      display: flex;
      gap: 16px;
      align-items: center;
      height: var(--header-h);
      padding: 0 20px;
      background: #111;
      border-bottom: 1px solid var(--card-border);
    }

    #header h1 {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #header h1 span {
      color: var(--accent);
    }

    #conn-status {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    #conn-dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      background: var(--error);
      border-radius: 50%;
      transition: background 0.3s;
    }

    #conn-dot.connected {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }
    #conn-dot.reconnecting {
      background: var(--warn);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    #conn-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Main grid ───────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 16px;
      margin-top: var(--header-h);
    }

    @media (max-width: 1100px) {
      #grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 860px) {
      #grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 620px) {
      #grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 400px) {
      #grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Instance card ───────────────────────────────────── */
    .instance-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      transition: border-color 0.2s;
    }

    .instance-card.active {
      border-color: #333;
    }
    .instance-card.error {
      border-color: var(--error);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      /* 160:144 aspect ratio */
      aspect-ratio: 160 / 144;
      overflow: hidden;
      background: #000;
    }

    .instance-card canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* pixelated is the cross-browser standard for nearest-neighbour upscaling */
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s;
    }

    .overlay.hidden {
      pointer-events: none;
      opacity: 0;
    }

    .instance-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      padding: 6px 10px;
      border-top: 1px solid #222;
    }

    .instance-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .fps-badge {
      min-width: 50px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-align: right;
      transition: color 0.3s;
    }

    .fps-badge.live {
      color: var(--accent);
    }
    .fps-badge.low {
      color: var(--warn);
    }
    </style>
  </head>
  <body>
    <header id="header">
      <h1>mGBA <span>Multi-Instance</span> Dashboard</h1>
      <div id="conn-status">
        <div id="conn-dot"></div>
        <span id="conn-label">Disconnected</span>
      </div>
    </header>

    <main id="grid"></main>

    <script>
    "use strict";

    // ── Constants ───────────────────────────────────────────────────────────────
    const INSTANCE_COUNT = 10;
    const LEGACY_HEADER_SIZE = 30;
    const HEADER_SIZE = 34;
    const FRAME_KEYFRAME = 1;
    const FRAME_DELTA = 2;
    const FLAG_DEFLATE_RAW = 1;
    const NATIVE_W = 160;
    const NATIVE_H = 144;
    const MAGIC = [0x50, 0x53, 0x4d, 0x47]; // "PSMG"

    // ── State ───────────────────────────────────────────────────────────────────
    /** @type {Array<{canvas: HTMLCanvasElement, ctx: CanvasRenderingContext2D, overlay: HTMLElement, fpsBadge: HTMLElement, card: HTMLElement, frameTs: number[]}>} */
    const instances = [];
    let ws = null;
    let reconnectDelay = 1000;
    let reconnectTimer = null;

    // ── Flag helper (avoids bitwise & operator) ──────────────────────────────────
    // For power-of-2 flags: (flags % (flag * 2)) >= flag
    function hasFlag(flags, flag) {
      return flags % (flag * 2) >= flag;
    }

    // ── Build DOM ───────────────────────────────────────────────────────────────
    const grid = document.getElementById("grid");

    for (let i = 0; i < INSTANCE_COUNT; i++) {
      const card = document.createElement("div");
      card.className = "instance-card";

      const wrap = document.createElement("div");
      wrap.className = "canvas-wrap";

      const canvas = document.createElement("canvas");
      canvas.width = NATIVE_W;
      canvas.height = NATIVE_H;

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.textContent = `Instance ${i} — waiting`;

      wrap.appendChild(canvas);
      wrap.appendChild(overlay);

      const info = document.createElement("div");
      info.className = "instance-info";

      const label = document.createElement("span");
      label.className = "instance-label";
      label.textContent = `Instance ${i}`;

      const fpsBadge = document.createElement("span");
      fpsBadge.className = "fps-badge";
      fpsBadge.textContent = "— fps";

      info.appendChild(label);
      info.appendChild(fpsBadge);
      card.appendChild(wrap);
      card.appendChild(info);
      grid.appendChild(card);

      instances[i] = {
        canvas,
        ctx: canvas.getContext("2d"),
        overlay,
        fpsBadge,
        card,
        frameTs: [],
      };
    }

    // ── Decompression ───────────────────────────────────────────────────────────
    async function inflateRaw(compressed) {
      const ds = new DecompressionStream("deflate-raw");
      const writer = ds.writable.getWriter();
      const reader = ds.readable.getReader();

      writer.write(compressed);
      writer.close();

      const chunks = [];
      let totalLen = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) {
          break;
        }
        chunks.push(value);
        totalLen += value.byteLength;
      }

      const result = new Uint8Array(totalLen);
      let off = 0;
      for (const chunk of chunks) {
        result.set(chunk, off);
        off += chunk.byteLength;
      }
      return result.buffer;
    }

    // ── Frame parsing ────────────────────────────────────────────────────────────
    function checkMagic(u8) {
      return (
        u8[0] === MAGIC[0] &&
        u8[1] === MAGIC[1] &&
        u8[2] === MAGIC[2] &&
        u8[3] === MAGIC[3]
      );
    }

    async function handleFrame(arrayBuf) {
      const u8 = new Uint8Array(arrayBuf);
      if (u8.byteLength < LEGACY_HEADER_SIZE) {
        return;
      }
      if (!checkMagic(u8)) {
        return;
      }

      const view = new DataView(arrayBuf);
      const version = u8[4];
      const headerSize = version >= 2 ? HEADER_SIZE : LEGACY_HEADER_SIZE;
      if (u8.byteLength < headerSize) {
        return;
      }

      const frameType = u8[5];
      const instanceIdx = u8[6];
      const flags = u8[7];
      const width = view.getUint16(16, false);
      const height = view.getUint16(18, false);
      const payloadBytes = view.getUint32(26, false);
      const metadataBytes = version >= 2 ? view.getUint32(30, false) : 0;
      const payloadOffset = headerSize + metadataBytes;

      if (instanceIdx >= INSTANCE_COUNT) {
        return;
      }
      if (u8.byteLength !== payloadOffset + payloadBytes) {
        return;
      }

      const inst = instances[instanceIdx];
      if (!inst) {
        return;
      }

      const compressed = arrayBuf.slice(
        payloadOffset,
        payloadOffset + payloadBytes
      );

      try {
        if (frameType === FRAME_KEYFRAME) {
          await decodeKeyframe(inst, compressed, flags, width, height);
        } else if (frameType === FRAME_DELTA) {
          await decodeDelta(inst, compressed, flags);
        }
        recordFpsFrame(inst);
      } catch (err) {
        console.warn("Frame decode error", err);
      }
    }

    async function decodeKeyframe(inst, compressed, flags, width, height) {
      let rgba;
      if (hasFlag(flags, FLAG_DEFLATE_RAW)) {
        rgba = await inflateRaw(compressed);
      } else {
        rgba = compressed;
      }

      const u8 = new Uint8Array(rgba);
      const expectedBytes = width * height * 4;
      if (u8.byteLength < expectedBytes) {
        return;
      }

      if (inst.canvas.width !== width || inst.canvas.height !== height) {
        inst.canvas.width = width;
        inst.canvas.height = height;
      }

      const imageData = new ImageData(
        new Uint8ClampedArray(u8.buffer, 0, expectedBytes),
        width,
        height
      );
      inst.ctx.putImageData(imageData, 0, 0);
      setOverlay(inst, null);
    }

    async function decodeDelta(inst, compressed, flags) {
      if (inst.canvas.width === 0 || inst.canvas.height === 0) {
        return;
      }

      let raw;
      if (hasFlag(flags, FLAG_DEFLATE_RAW)) {
        raw = await inflateRaw(compressed);
      } else {
        raw = compressed;
      }

      const view = new DataView(raw);
      const u8 = new Uint8Array(raw);

      if (u8.byteLength < 2) {
        return;
      }
      const tileCount = view.getUint16(0, false);
      if (tileCount === 0) {
        return;
      }

      let offset = 2;
      for (let t = 0; t < tileCount; t++) {
        if (offset + 8 > u8.byteLength) {
          break;
        }
        const x = view.getUint16(offset, false);
        const y = view.getUint16(offset + 2, false);
        const w = view.getUint16(offset + 4, false);
        const h = view.getUint16(offset + 6, false);
        offset += 8;

        const pixelBytes = w * h * 4;
        if (offset + pixelBytes > u8.byteLength) {
          break;
        }

        const pixelData = new Uint8ClampedArray(raw, offset, pixelBytes);
        const imageData = new ImageData(pixelData, w, h);
        inst.ctx.putImageData(imageData, x, y);
        offset += pixelBytes;
      }

      setOverlay(inst, null);
    }

    // ── FPS tracking ─────────────────────────────────────────────────────────────
    function recordFpsFrame(inst) {
      const now = performance.now();
      inst.frameTs.push(now);
      const cutoff = now - 2000;
      while (inst.frameTs.length > 0 && inst.frameTs[0] < cutoff) {
        inst.frameTs.shift();
      }
    }

    function updateFpsDisplays() {
      const now = performance.now();
      for (const inst of instances) {
        const cutoff = now - 1000;
        let count = 0;
        for (let i = inst.frameTs.length - 1; i >= 0; i--) {
          if (inst.frameTs[i] >= cutoff) {
            count++;
          } else {
            break;
          }
        }
        const badge = inst.fpsBadge;
        if (count === 0) {
          badge.textContent = "— fps";
          badge.className = "fps-badge";
        } else if (count < 30) {
          badge.textContent = `${count} fps`;
          badge.className = "fps-badge low";
        } else {
          badge.textContent = `${count} fps`;
          badge.className = "fps-badge live";
        }
      }
    }

    // ── Overlay helpers ───────────────────────────────────────────────────────────
    function setOverlay(inst, message) {
      if (message === null) {
        inst.overlay.classList.add("hidden");
        inst.card.classList.add("active");
        inst.card.classList.remove("error");
      } else {
        inst.overlay.textContent = message;
        inst.overlay.classList.remove("hidden");
        inst.card.classList.remove("active");
      }
    }

    function setAllOverlays(message, isError) {
      for (let i = 0; i < INSTANCE_COUNT; i++) {
        const inst = instances[i];
        inst.overlay.textContent = message || `Instance ${i} — waiting`;
        inst.overlay.classList.remove("hidden");
        inst.card.classList.remove("active");
        if (isError) {
          inst.card.classList.add("error");
        } else {
          inst.card.classList.remove("error");
        }
      }
    }

    // ── Connection status UI ──────────────────────────────────────────────────────
    const connDot = document.getElementById("conn-dot");
    const connLabel = document.getElementById("conn-label");

    function setConnStatus(state) {
      connDot.className = "";
      if (state === "connected") {
        connDot.classList.add("connected");
        connLabel.textContent = "Connected";
      } else if (state === "reconnecting") {
        connDot.classList.add("reconnecting");
        connLabel.textContent = "Reconnecting…";
      } else {
        connLabel.textContent = "Disconnected";
      }
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────────
    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws/dashboard`;
    }

    function detachCurrentSocket() {
      if (!ws) {
        return;
      }
      ws.onopen = null;
      ws.onclose = null;
      ws.onerror = null;
      ws.onmessage = null;
      ws.close();
      ws = null;
    }

    function connect() {
      detachCurrentSocket();

      setConnStatus("reconnecting");
      setAllOverlays("Connecting…", false);

      const socket = new WebSocket(wsUrl());
      socket.binaryType = "arraybuffer";
      ws = socket;

      socket.onopen = () => {
        reconnectDelay = 1000;
        setConnStatus("connected");
        setAllOverlays("Waiting for frames…", false);
        try {
          socket.send(JSON.stringify({ type: "keyframe" }));
        } catch (sendErr) {
          console.warn("keyframe request failed", sendErr);
        }
      };

      socket.onmessage = (evt) => {
        if (evt.data instanceof ArrayBuffer) {
          handleFrame(evt.data).catch((frameErr) => {
            console.warn("handleFrame error", frameErr);
          });
        }
      };

      socket.onclose = () => {
        if (socket !== ws) {
          return;
        }
        ws = null;
        setConnStatus("reconnecting");
        setAllOverlays("Disconnected — reconnecting…", false);
        scheduleReconnect();
      };

      socket.onerror = () => {
        if (socket !== ws) {
          return;
        }
        ws = null;
        setConnStatus("reconnecting");
        setAllOverlays("Connection error — reconnecting…", true);
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        connect();
      }, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10_000);
    }

    // ── Boot ──────────────────────────────────────────────────────────────────────
    connect();
    setInterval(updateFpsDisplays, 1000);
    </script>
  </body>
</html>
